<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    color:#000;
    font-family:'Inter',sans-serif;
}


/* NAVIGAZIONE */

.back{
    position:fixed;

    top:30px;
    left:40px;

    color:#000;
    text-decoration:none;

    font-size:0.9rem;

    z-index:10;
}

.back:hover{

}


/* TESTATA */

.intro{
    width:78%;
    max-width:1200px;

    margin:120px auto 70px;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

.title{
    font-size:2.4rem;
    line-height:1;
    font-weight:500;
    letter-spacing:-0.04em;
}

.subtitle{
    font-size:0.85rem;
    font-weight:300;
    line-height:1.5;
    text-align:right;
}


/* GALLERIA */

.gallery{
    width:72%;
    max-width:1100px;

    margin:0 auto 120px;
}

.gallery img{
    width:100%;

    aspect-ratio:1.618 / 1;

    object-fit:cover;

    display:block;

    margin-bottom:80px;
}


/* MOBILE */

@media(max-width:700px){

    .back{
        top:20px;
        left:25px;
    }

    .intro{
        width:90%;
        margin:100px auto 50px;

        display:block;
    }

    .title{
        font-size:2rem;
    }

    .subtitle{
        margin-top:20px;
        text-align:left;
    }

    .gallery{
        width:90%;
    }

    .gallery img{
