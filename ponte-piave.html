<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuovo Ponte sul Piave — Sergio Sbardella</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D8C04A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    color:black;
    font-family:'Inter',sans-serif;
}

.back{
    position:fixed;
    top:30px;
    left:30px;
    text-decoration:none;
    color:black;
    font-size:14px;
    z-index:100;
}

.container{

    width:90%;
    max-width:1400px;

    margin:120px auto;

    display:grid;
    grid-template-columns:280px 1fr;
    gap:80px;
}

.info{

    position:sticky;
    top:120px;

    align-self:start;
}

.info h1{

    font-size:3.2rem;
    line-height:0.95;
    font-weight:600;

    margin-bottom:40px;
}

.info p{

    font-size:1rem;
    line-height:1.8;
}

.line{

    width:40px;
    height:2px;

    background:#D8C04A;

    margin:0 0 35px 0;
}

.gallery{

    display:flex;
    flex-direction:column;
    gap:50px;
}

.gallery img{

    width:100%;
    max-width:1000px;

    display:block;
}

@media(max-width:900px){

    .container{

        grid-template-columns:1fr;
        gap:60px;
    }

    .info{

        position:relative;
        top:auto;
    }

    .info h1{

        font-size:2.3rem;
    }

}

</style>

</head>

<body>

<a class="back" href="progetti.html">
← Progetti
</a>

<div class="container">

  <div class="info">

    <h1>
        NUOVO PONTE<br>
        SUL PIAVE
    </h1>

    <div class="line"></div>

    <p>
        Concorso internazionale di progettazione<br>
        4° classificato
    </p>

</div>

    <div class="gallery">

        <img src="img/ponte-piave/1.jpg" alt="">
        <img src="img/ponte-piave/2.jpg" alt="">
        <img src="img/ponte-piave/3.jpg" alt="">
        <img src="img/ponte-piave/4.jpg" alt="">

    </div>

</div>

</body>
</html>
