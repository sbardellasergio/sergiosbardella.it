<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progetti — Sergio Sbardella</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D8C04A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:'Inter', sans-serif;
}


/* HEADER */

header{
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.title{
    font-size:0.9rem;
    font-weight:500;
}

.back{
    color:#000;
    text-decoration:none;
    font-size:0.9rem;
}

.back:hover{
    text-decoration:underline;
}


/* GRIGLIA PROGETTI */

.projects{
    width:80%;
    max-width:1200px;

    margin:70px auto 120px;

    display:grid;

    grid-template-columns:repeat(3, 280px);

    justify-content:space-between;

    column-gap:40px;
    row-gap:100px;
}


/* QUADRATI */

.project{
    width:280px;
    height:280px;

    display:block;

    text-decoration:none;
}

.project img{
    width:280px;
    height:280px;

    display:block;

    object-fit:cover;

    transition:opacity 0.25s ease;
}

.project:hover img{
    opacity:0.8;
}


/* TABLET */

@media(max-width:1050px){

    .projects{
        width:90%;
        grid-template-columns:repeat(2, 280px);
        justify-content:space-around;
    }

}


/* MOBILE */

@media(max-width:650px){

    header{
        padding:25px;
    }

    .projects{
        width:100%;
        margin-top:40px;

        grid-template-columns:280px;

        justify-content:center;

        row-gap:60px;
    }

}

</style>

</head>


<body>


<header>

    <div class="title">
        PROGETTI
    </div>

    <a class="back" href="index.html">
        ← Home
    </a>

</header>


<main class="projects">


    <!-- PROGETTO 01 -->

    <a class="project" href="ponte-piave.html">

        <img
            src="img/ponte-piave/r1.jpeg"
            alt="Nuovo Ponte sul Piave"
        >

    </a>


    <!--
    I PROSSIMI PROGETTI ANDRANNO QUI

    <a class="project" href="progetto-2.html">
        <img src="img/progetto-2/copertina.jpg" alt="">
    </a>

    <a class="project" href="progetto-3.html">
        <img src="img/progetto-3/copertina.jpg" alt="">
    </a>
    -->


</main>


</body>

</html>
