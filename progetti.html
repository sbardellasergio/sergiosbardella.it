<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progetti — Sergio Sbardella</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D8C04A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:'Inter',sans-serif;
}

header{
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:0.9rem;
    font-weight:500;
    letter-spacing:0.02em;
}

.back{
    color:#000;
    text-decoration:none;
    font-size:0.9rem;
}

.back:hover{
    text-decoration:underline;
}


/* GRIGLIA */

.projects{

    width:90%;
    max-width:1400px;

    margin:80px auto 120px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:80px;
}


/* CARD */

.project{

    text-decoration:none;
    color:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:opacity .25s ease;
}

.project:hover{
    opacity:.85;
}


/* IMMAGINI */

.project img{

    max-width:100%;
    max-height:420px;

    width:auto;
    height:auto;

    display:block;
}


/* MOBILE */

@media(max-width:1000px){

    .projects{

        grid-template-columns:repeat(2,1fr);

        gap:60px;
    }

}

@media(max-width:700px){

    header{
        padding:25px;
    }

    .projects{

        width:100%;

        padding:0 25px;

        grid-template-columns:1fr;

        gap:50px;
    }

    .project img{

        max-height:320px;
    }

}

</style>

</head>

<body>

<header>

    <div class="title">
        PROGETTI
    </div>

    <a class="back" href="index.html">
        ← Home
    </a>

</header>


<main class="projects">

    <!-- PONTE SUL PIAVE -->

    <a class="project" href="ponte-piave.html">

        <img
            src="img/ponte-piave/1.jpg"
            alt="Nuovo Ponte sul Piave"
        >

    </a>


    <!-- APPARTAMENTO M+P -->

    <a class="project" href="appartamento-mp.html">

        <img
            src="img/appartamento-mp/7.png"
            alt="Appartamento M+P"
        >

    </a>

</main>

</body>
</html>
