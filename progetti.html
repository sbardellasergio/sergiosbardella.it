<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progetti — Sergio Sbardella</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D8C04A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    color:#000;
    font-family:'Inter',sans-serif;
}


/* HEADER */

header{
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.title{
    font-size:0.9rem;
    font-weight:500;
}

.back{
    color:#000;
    text-decoration:none;
    font-size:0.9rem;
}

.back:hover{
    text-decoration:underline;
}


/* GRIGLIA */

.projects{
    width:80%;
    max-width:1200px;

    margin:70px auto 120px;

    display:grid;
    grid-template-columns:repeat(3, 1fr);

    column-gap:60px;
    row-gap:100px;
}


/* PROGETTO */

.project{
    display:block;
    text-decoration:none;
    color:#000;
}

.project-image{
    width:100%;
    aspect-ratio:1.618 / 1;

    display:block;

    object-fit:cover;

    transition:opacity 0.25s ease;
}

.project:hover .project-image{
    opacity:0.8;
}


/* TESTO */

.project-info{
    margin-top:18px;
}

.project-title{
    font-size:0.95rem;
    font-weight:500;
    line-height:1.3;
}

.project-subtitle{
    margin-top:5px;

    font-size:0.78rem;
    font-weight:300;
    line-height:1.4;
}


/* TABLET */

@media(max-width:1000px){

    .projects{
        width:88%;
        grid-template-columns:repeat(2, 1fr);
        column-gap:40px;
        row-gap:70px;
    }

}


/* MOBILE */

@media(max-width:600px){

    header{
        padding:25px;
    }

    .projects{
        width:100%;
        padding:0 25px;

        grid-template-columns:1fr;

        margin-top:40px;
        row-gap:60px;
    }

}

</style>

</head>


<body>


<header>

    <div class="title">
        PROGETTI
    </div>

    <a class="back" href="index.html">
        ← Home
    </a>

</header>


<main class="projects">


    <!-- PROGETTO 01 -->

    <a class="project" href="ponte-piave.html">

        <img
            class="project-image"
            src="img/ponte-piave/1.jpg"
            alt="Nuovo Ponte sul Piave"
        >

        <div class="project-info">

            <div class="project-title">
                NUOVO PONTE SUL PIAVE
            </div>

            <div class="project-subtitle">
                Concorso internazionale di progettazione · 4° classificato
            </div>

        </div>

    </a>


    <!-- I PROSSIMI PROGETTI ANDRANNO QUI -->


</main>


</body>

</html>
