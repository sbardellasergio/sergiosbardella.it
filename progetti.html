<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:'Inter',sans-serif;
}

.menu{
    position:fixed;
    top:30px;
    right:30px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:100;
}

.menu a{
    color:#000;
    text-decoration:none;
    font-size:14px;
}

.menu a:hover{
    text-decoration:underline;
}

header{
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:0.9rem;
    font-weight:500;
    letter-spacing:0.02em;
}

/* GRIGLIA */

.projects{

    width:90%;
    max-width:1400px;

    margin:80px auto 120px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:80px;
}

/* CARD */

.project{

    text-decoration:none;
    color:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:opacity .25s ease;
}

.project:hover{
    opacity:.85;
}

/* IMMAGINI */

.project img{

    max-width:100%;
    max-height:420px;

    width:auto;
    height:auto;

    display:block;
}

/* MOBILE */

@media(max-width:1000px){

    .projects{

        grid-template-columns:repeat(2,1fr);

        gap:60px;
    }

}

@media(max-width:700px){

    header{
        padding:25px;
    }

    .projects{

        width:100%;

        padding:0 25px;

        grid-template-columns:1fr;

        gap:50px;
    }

    .project img{

        max-height:320px;
    }

}

</style>

</head>
