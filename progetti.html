<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progetti — Sergio Sbardella</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D8C04A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:'Inter', sans-serif;
}


/* HEADER */

header{
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.title{
    font-size:0.9rem;
    font-weight:500;
}

.back{
    color:#000;
    text-decoration:none;
    font-size:0.9rem;
}

.back:hover{
    text-decoration:underline;
}


/* GRIGLIA */

.projects{
    width:100%;
    padding:70px 10% 120px;

    display:grid;
    grid-template-columns:repeat(3, 1fr);

    column-gap:70px;
    row-gap:110px;

    align-items:start;
}


/* PROGETTO */

.project{
    display:block;
    width:100%;

    text-decoration:none;
    color:#000;

    transition:opacity 0.3s ease;
}

.project img{
    width:100%;
    aspect-ratio:1 / 1;

    object-fit:cover;
    display:block;

    transition:opacity 0.3s ease;
}

.project:hover img{
    opacity:0.82;
}


/* SFALSAMENTO */

.project:nth-child(2){
    margin-top:70px;
}

.project:nth-child(3){
    margin-top:25px;
}

.project:nth-child(5){
    margin-top:60px;
}


/* MOBILE */

@media(max-width:900px){

    .projects{
        padding:50px 7% 80px;

        grid-template-columns:repeat(2, 1fr);

        column-gap:35px;
        row-gap:70px;
    }

    .project:nth-child(2),
    .project:nth-child(3),
    .project:nth-child(5){
        margin-top:0;
    }

}


@media(max-width:600px){

    header{
        padding:25px;
    }

    .projects{
        padding:35px 25px 60px;

        grid-template-columns:1fr;

        row-gap:55px;
    }

    .project:nth-child(2),
    .project:nth-child(3),
    .project:nth-child(5){
        margin-top:0;
    }

}

</style>

</head>


<body>


<header>

    <div class="title">
        PROGETTI
    </div>

    <a class="back" href="index.html">
        ← Home
    </a>

</header>


<main class="projects">


    <!-- PONTE SUL PIAVE -->

    <a class="project" href="ponte-piave.html">

        <img
            src="img/ponte-piave/r1.jpeg"
            alt="Nuovo Ponte sul Piave"
        >

    </a>


</main>


</body>

</html>
