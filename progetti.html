<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progetti — Sergio Sbardella</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D8C04A'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    color:#000;
    font-family:'Inter',sans-serif;
}

header{
    padding:40px;
    display:flex;
    justify-content:space-between;
}

.title{
    font-size:0.9rem;
    font-weight:500;
}

.back{
    color:#000;
    text-decoration:none;
    font-size:0.9rem;
}

.projects{
    width:80%;
    max-width:1200px;
    margin:70px auto 120px;

    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:80px 60px;
}

.project{
    display:block;
    text-decoration:none;
}

.project img{
    width:100%;
    aspect-ratio:1.618 / 1;
    object-fit:cover;
    display:block;

    transition:opacity 0.25s ease;
}

.project:hover img{
    opacity:0.8;
}

@media(max-width:900px){

    .projects{
        width:88%;
        grid-template-columns:repeat(2, 1fr);
        gap:60px 40px;
    }

}

@media(max-width:600px){

    header{
        padding:25px;
    }

    .projects{
        width:100%;
        padding:0 25px;
        grid-template-columns:1fr;
        margin-top:40px;
    }

}

</style>

</head>

<body>

<header>

    <div class="title">
        PROGETTI
    </div>

    <a class="back" href="index.html">
        ← Home
    </a>

</header>

<main class="projects">

    <a class="project" href="ponte-piave.html">
        <img
            src="img/ponte-piave/1.jpg"
            alt="Nuovo Ponte sul Piave"
        >
    </a>

</main>

</body>

</html>
