<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sergio Sbardella</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html, body{
            height:100%;
        }

        body{
            background:#D8C04A;
            font-family:'Inter',sans-serif;
            color:#000;
            position:relative;
        }

        .hero{
            position:absolute;
            left:12%;
            top:50%;
            transform:translateY(-50%);
        }

        h1{
            font-size:4.2rem;
            font-weight:600;
            letter-spacing:-0.05em;
            line-height:0.95;
        }

        .role{
            margin-top:32px;
            font-size:1.15rem;
            font-weight:400;
        }

        .email{
            margin-top:18px;
            font-size:1rem;
        }

        .email a{
            color:#000;
            text-decoration:none;
        }

        .email a:hover{
            text-decoration:underline;
        }

        .menu{
            position:absolute;
            right:40px;
            bottom:40px;
            text-align:right;
        }

        .menu a{
            display:block;
            color:#000;
            text-decoration:none;
            font-size:0.9rem;
            margin-bottom:8px;
        }

        .menu a:hover{
            text-decoration:underline;
        }

        @media (max-width:768px){

            .hero{
                left:32px;
                right:32px;
            }

            h1{
                font-size:2.8rem;
            }

            .menu{
                right:32px;
                bottom:32px;
            }
        }

    </style>
</head>

<body>

    <div class="hero">

        <h1>SERGIO SBARDELLA</h1>

        <div class="role">
            Architetto
        </div>

        <div class="email">
            <a href="mailto:sbardellasergio@gmail.com">
                sbardellasergio@gmail.com
            </a>
        </div>

    </div>

    <div class="menu">
        <a href="#">Profilo</a>
        <a href="#">Progetti</a>
    </div>

</body>

</html>
